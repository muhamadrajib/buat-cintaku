<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiket Menuju Maomao</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--sky:#cfe3f5;--sky2:#ffe3d3;--navy:#1f3a5f;--coral:#ff6b5b;--ticket:#fffaf4;--soft:#6c7f99;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;min-height:100svh;background:linear-gradient(180deg,var(--sky) 0,var(--sky2) 100%) fixed;color:var(--navy);font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:500;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
main{max-width:30rem;margin:0 auto;padding:36px 18px 80px}
h1{font-weight:800;font-size:clamp(1.7rem,7vw,2.3rem);line-height:1.1;margin:0 0 6px}
.sub{margin:0 0 24px;color:var(--soft)}

.ticket{background:var(--ticket);border-radius:18px;box-shadow:0 14px 30px rgba(31,58,95,.16);position:relative;overflow:hidden}
.ticket .top{padding:22px 22px 18px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.place b{display:block;font-size:2rem;font-weight:800;line-height:1}
.place small{color:var(--soft)}
.place.r{text-align:right}
.mid{font-size:1.6rem}
.cut{border-top:2px dashed #d9cdbd;margin:0 14px;position:relative}
.cut:before,.cut:after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:#e8e6ef}
.cut:before{left:-26px}.cut:after{right:-26px}
.info{padding:16px 22px 22px;display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.info div small{display:block;color:var(--soft);font-size:.8rem}
.info div span{font-weight:800}
.stamp{position:absolute;right:18px;bottom:16px;border:3px solid var(--coral);color:var(--coral);font-weight:800;letter-spacing:.12em;padding:2px 12px;border-radius:8px;transform:rotate(-12deg) scale(1.6);opacity:0;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.stamp.on{opacity:.9;transform:rotate(-12deg) scale(1)}

.fly{margin-top:22px;background:rgba(255,255,255,.55);border-radius:18px;padding:16px 14px 20px}
svg#map{width:100%;height:auto;display:block;overflow:visible}
#msg{text-align:center;min-height:2.8em;margin:6px 8px 12px}
#go{display:block;width:100%;position:relative;overflow:hidden;border:0;border-radius:14px;padding:16px;background:var(--navy);color:#fff;font-weight:800;font-size:1.05rem;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#go i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--coral)}
#go span{position:relative}
#go[disabled]{opacity:.6;cursor:default}

#after{margin-top:34px}
#after[hidden]{display:none}
#after h2{font-size:1.5rem;font-weight:800;margin:0 0 4px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 28px}
.card{perspective:700px;height:150px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.card div{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s}
.card[aria-pressed=true] div{transform:rotateY(180deg)}
.card p{position:absolute;inset:0;margin:0;padding:14px;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center}
.card .f{background:var(--navy);color:#fff;font-weight:800;font-size:1.05rem}
.card .b{background:var(--ticket);transform:rotateY(180deg);font-size:.88rem;line-height:1.4}
.note{font-family:Caveat,cursive;font-size:1.9rem;text-align:right;margin:0 6px 28px}
.when label{display:block;margin-bottom:6px;color:var(--soft)}
.when input{background:#fff;border:1px solid #b9c7d9;border-radius:10px;padding:9px 12px}
#count{margin:12px 0 0;font-size:1.1rem}
#count b{font-size:2.4rem;font-weight:800;color:var(--coral);line-height:1}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card div,.stamp{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Tiket buat Maomao</h1>
  <p class="sub">Penerbangan khusus, penumpangnya cuma satu.</p>

  <div class="ticket">
    <div class="top">
      <div class="place"><b>JEEN</b><small>kotaku</small></div>
      <div class="mid" aria-hidden="true">✈</div>
      <div class="place r"><b>MIA</b><small>kotamu</small></div>
    </div>
    <div class="cut"></div>
    <div class="info">
      <div><small>Penumpang</small><span>Maomao</span></div>
      <div><small>Penerbangan</small><span>RINDU 01</span></div>
      <div><small>Gerbang</small><span>Hati</span></div>
      <div><small>Kursi</small><span>Di sebelahku</span></div>
    </div>
    <div class="stamp" id="stamp">TIBA</div>
  </div>

  <div class="fly">
    <svg id="map" viewBox="0 0 360 170" aria-hidden="true">
      <path id="track" d="M34 138 C100 10 260 10 326 138" fill="none" stroke="#9db4cf" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
      <path id="done" d="M34 138 C100 10 260 10 326 138" fill="none" stroke="#ff6b5b" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="34" cy="138" r="7" fill="#1f3a5f"/><circle cx="326" cy="138" r="7" fill="#ff6b5b"/>
      <text x="34" y="162" text-anchor="middle" font-size="13" fill="#1f3a5f" font-weight="800">Jeen</text>
      <text x="326" y="162" text-anchor="middle" font-size="13" fill="#ff6b5b" font-weight="800">Mia</text>
      <g id="plane"><path d="M-14 0 L14 -8 L6 0 L14 8 Z M-14 0 L6 0 L-2 5 Z" fill="#1f3a5f"/></g>
    </svg>
    <p id="msg" aria-live="polite">Pesawatnya belum jalan. Tahan tombol di bawah supaya terbang.</p>
    <button id="go" aria-label="Tahan untuk terbang menuju Maomao"><i></i><span>Tahan buat terbang</span></button>
  </div>

  <div id="after" hidden>
    <h2>Selamat datang, Maomao</h2>
    <p class="sub">Ketuk kartunya satu-satu.</p>
    <div class="cards">
      <button class="card" aria-pressed="false"><div><p class="f">Pas aku lagi capek</p><p class="b">Suaramu di telepon udah cukup jadi tempat istirahat.</p></div></button>
      <button class="card" aria-pressed="false"><div><p class="f">Soal jarak</p><p class="b">Kita nggak lagi nunggu waktu lewat. Kita lagi bangun sesuatu, pelan-pelan, dari dua tempat.</p></div></button>
      <button class="card" aria-pressed="false"><div><p class="f">Yang aku tunggu</p><p class="b">Bukan tanggalnya. Tapi mukamu pas aku sampai.</p></div></button>
      <button class="card" aria-pressed="false"><div><p class="f">Satu pesan kecil</p><p class="b">Hari yang berat nggak perlu kamu hadapi sendirian. Aku di ujung telepon.</p></div></button>
    </div>
    <p class="note">dari Jeen</p>
    <div class="when">
      <label for="date">Kapan kita ketemu?</label>
      <input type="date" id="date">
      <p id="count" aria-live="polite"></p>
    </div>
  </div>
</main>

<script>
(function(){
  var path=document.getElementById('track'),done=document.getElementById('done'),plane=document.getElementById('plane'),
      go=document.getElementById('go'),bar=go.querySelector('i'),label=go.querySelector('span'),msg=document.getElementById('msg'),
      stamp=document.getElementById('stamp'),after=document.getElementById('after'),
      len=path.getTotalLength(),p=0,hold=false,last=0,landed=false,running=false;
  done.style.strokeDasharray=len;

  function draw(){
    var pt=path.getPointAtLength(p*len),a=path.getPointAtLength(Math.min(len,p*len+2)),b=path.getPointAtLength(Math.max(0,p*len-2));
    var ang=Math.atan2(a.y-b.y,a.x-b.x)*180/Math.PI;
    plane.setAttribute('transform','translate('+pt.x+' '+pt.y+') rotate('+ang+')');
    done.style.strokeDashoffset=len*(1-p);
    bar.style.width=(p*100)+'%';
  }
  function text(){
    if(p<.02)return;
    msg.textContent=p<.3?'Lepas landas. Jangan dilepas dulu.':p<.6?'Udah setengah jalan lebih.':p<.9?'Kelihatan kotanya...':'Bentar lagi mendarat.';
  }
  function land(){
    landed=true;hold=false;p=1;draw();go.disabled=true;label.textContent='Sudah sampai';
    msg.textContent='Mendarat dengan selamat.';
    stamp.classList.add('on');after.hidden=false;
    setTimeout(function(){after.scrollIntoView({behavior:'smooth',block:'start'});},700);
  }
  function tick(t){
    if(landed)return;
    var dt=Math.min(50,t-last)/1000;last=t;
    if(hold)p+=dt/3.8;else if(p>0)p=Math.max(0,p-dt/14);
    if(p>=1){land();return;}
    draw();text();
    if(hold||p>0)requestAnimationFrame(tick);else running=false;
  }
  function start(){if(landed||hold)return;hold=true;label.textContent='Terus tahan...';
    if(!running){running=true;last=performance.now();requestAnimationFrame(tick);}}
  function stop(){hold=false;if(!landed)label.textContent='Tahan buat terbang';}
  go.addEventListener('pointerdown',function(e){e.preventDefault();go.setPointerCapture(e.pointerId);start();});
  go.addEventListener('pointerup',stop);go.addEventListener('pointercancel',stop);
  go.addEventListener('contextmenu',function(e){e.preventDefault();});
  go.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();start();}});
  go.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter')stop();});
  draw();

  var cards=document.querySelectorAll('.card');
  for(var i=0;i<cards.length;i++)cards[i].addEventListener('click',function(){
    this.setAttribute('aria-pressed',this.getAttribute('aria-pressed')==='true'?'false':'true');
  });

  var date=document.getElementById('date'),count=document.getElementById('count');
  function calc(){
    if(!date.value){count.textContent='';return;}
    var t=new Date(date.value+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);
    var d=Math.round((t-n)/86400000);
    if(d>0)count.innerHTML='<b>'+d+'</b> hari lagi';
    else if(d===0)count.innerHTML='<b>Hari ini.</b> Peluk yang beneran.';
    else count.textContent='Tanggal itu sudah lewat. Pilih yang berikutnya ya.';
  }
  try{var sv=localStorage.getItem('tiket-maomao-date');if(sv){date.value=sv;calc();}}catch(e){}
  date.addEventListener('change',function(){calc();try{localStorage.setItem('tiket-maomao-date',date.value);}catch(e){}});
})();
</script>
</body>
</html>
